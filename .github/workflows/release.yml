name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.1)'
        required: true
        default: '0.0.0-dev'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git-cliff needs the full history and tags

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # tag "v1.0.1" -> "1.0.1"; manual runs use the input instead
      - name: Resolve version
        id: v
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # changelog for THIS release, from the conventional commits since the last tag
      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Publish (self-contained, single file)
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          dotnet publish src/VaultType/VaultType.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=$env:VERSION `
            -o publish
          Copy-Item publish/VaultType.exe "VaultType-${env:VERSION}-win-x64.exe"

      - name: Build installer (Inno Setup)
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=$env:VERSION installer\VaultType.iss

      # keep the builds around even for manual/test runs that don't cut a release
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultType-win-x64
          path: VaultType-*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: VaultType-*.exe
          body_path: RELEASE_NOTES.md

      # keep a CHANGELOG.md in the repo, refreshed on the default branch
      - name: Switch to default branch
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ github.event.repository.default_branch }}"
          git checkout "${{ github.event.repository.default_branch }}"

      - name: Regenerate CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --tag ${{ github.ref_name }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Commit CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git add CHANGELOG.md
          git diff --staged --quiet && { echo "changelog unchanged"; exit 0; }
          git commit -m "docs: update changelog for ${GITHUB_REF_NAME} [skip ci]"
          git push origin HEAD

  # Submit the packaged (passkey-capable) edition to the Microsoft Store. Tag pushes only -
  # manual test runs must not create Store submissions. Certification takes 1-3 business days;
  # only one submission can be in flight at a time.
  store:
    runs-on: windows-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    # never two of these at once (tags pushed back to back), and never cancel a running upload
    concurrency:
      group: store-submission
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: v
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Store identity is stamped by the script; the package stays unsigned (the Store signs it).
      - name: Build Store MSIX
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: pwsh packaging/msix/build-msix.ps1 -Store -Version "$env:VERSION.0"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: VaultType-Store-msix
          path: packaging/msix/out/VaultType-Store.msix

      - name: Configure Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@15abd1c50fcc164b19cb240fb04ef3c49bf715a2 # v1.1

      - name: Reconfigure store credentials
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          msstore reconfigure `
            --tenantId $env:TENANT_ID `
            --sellerId $env:SELLER_ID `
            --clientId $env:CLIENT_ID `
            --clientSecret $env:CLIENT_SECRET

      - name: Publish to Store
        run: msstore publish packaging/msix/out/VaultType-Store.msix -id 9N5CLMW5XJ49
