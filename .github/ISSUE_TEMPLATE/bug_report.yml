name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Do not include your master password, vault contents, server URL, or any other secrets.**
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected to happen instead.
      placeholder: When I press the hotkey on <site>, VaultType types ... but I expected ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VaultType version
      description: Shown next to "VaultType" in the Settings title bar.
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2 (x64)
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - Self-hosted Vaultwarden
        - Bitwarden.com (US)
        - Bitwarden.eu (EU)
        - Self-hosted Bitwarden
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: The target app or browser, screenshots, or other context. Remember - no secrets.
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and this hasn't been reported yet.
          required: true
        - label: This report contains no passwords, vault data, or other secrets.
          required: true
